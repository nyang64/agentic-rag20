[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scraper"
version = "0.1.0"
description = "Agentic RAG with Microsoft AutoGen agent and pgvector knowledge base"
authors = [{ name="Nanchang Yang" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "autogen-agentchat==0.7.5",
    "autogen-ext[openai]==0.7.5",
    "sentence-transformers==5.1.2",
    "torch==2.2.2",
    "transformers==4.57.1",
    "safetensors==0.6.2",
    "psycopg2-binary==2.9.11",
    "pgvector==0.3.6",
    "beautifulsoup4",
    "requests",
    "ddgs>=9.14.2",
    "python-dotenv",
    "langchain-core==1.4.8",
    "langsmith==0.4.39",
    "ragas==0.4.3",
    "deepeval==4.0.7",
    "pytest==9.1.1",
    "pytest-rerunfailures==16.3",
]

[tool.setuptools.packages.find]
where = ["."]
